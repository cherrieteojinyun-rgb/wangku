<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Wangku — personal finance app project">
  <title>Wangku</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #17211b; background: #f4f7f3; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; }
    main { width: min(100%, 680px); padding: clamp(28px, 7vw, 56px); border: 1px solid #dce5dc; border-radius: 24px; background: #fff; box-shadow: 0 18px 60px #19391a12; }
    .label { color: #39734b; font-size: .8rem; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
    h1 { margin: 12px 0; font-size: clamp(2.5rem, 8vw, 4rem); line-height: 1; }
    p { color: #536157; font-size: 1.08rem; line-height: 1.7; }
    a { display: inline-block; margin-top: 16px; padding: 12px 18px; border-radius: 10px; background: #24633b; color: white; font-weight: 650; text-decoration: none; }
    a:hover, a:focus-visible { background: #194b2b; }
    .note { margin-top: 28px; padding-top: 20px; border-top: 1px solid #e5ebe5; font-size: .92rem; }
  </style>
</head>
<body>
  <main>
    <div class="label">Wangku</div>
    <h1>Welcome</h1>
    <p>Wangku is a personal finance app project. This page is the project’s GitHub Pages landing page; the app itself is currently prepared for Android, not as a browser-based website.</p>
    <a href="https://github.com/cherrieteojinyun-rgb/wangku/blob/main/Updated%20Wangku/Updated%20Wangku/START_HERE.md">Android setup instructions</a>
    <p class="note">View the <a href="https://github.com/cherrieteojinyun-rgb/wangku" style="margin:0;padding:0;background:none;color:#24633b;text-decoration:underline">source code on GitHub</a>.</p>
  </main>
</body>
</html>
